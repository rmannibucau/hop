KubernetesConnection.name=Kubernetes Connection
KubernetesConnection.description=A Kubernetes connection using a kubeconfig file, explicit parameters or the in-cluster service account
KubernetesConnectionEditor.Name.Label=Kubernetes connection name
KubernetesConnectionEditor.ConnectionGroup.Label=Connection config
KubernetesConnectionEditor.TestButton.Label=Test
KubernetesConnectionEditor.TestOk.Title=Connection success
KubernetesConnectionEditor.TestOk.Message=The Kubernetes connection could be created successfully
KubernetesConnectionEditor.TestError.Title=Connection failure
KubernetesConnectionEditor.TestError.Message=We couldn't connect using this information
KubernetesMetadata.Master.Label=Master URL
KubernetesMetadata.Master.ToolTip=Kubernetes API server URL. Empty = derived from the kubeconfig or the in-cluster service account
KubernetesMetadata.KubeconfigFile.Label=Kubeconfig file
KubernetesMetadata.KubeconfigFile.ToolTip=Path to the kubeconfig file, supports variables. Default '${KUBECONFIG}' or ~/.kube/config
KubernetesMetadata.Context.Label=Context
KubernetesMetadata.Context.ToolTip=Context name inside the kubeconfig. Empty = current context
KubernetesMetadata.Namespace.Label=Namespace
KubernetesMetadata.Namespace.ToolTip=Default namespace for the operations, supports variables
KubernetesMetadata.Token.Label=Token file
KubernetesMetadata.Token.ToolTip=Path to a file containing the bearer token, supports variables/secret resolvers. Empty = from kubeconfig
KubernetesMetadata.CaCertFile.Label=CA certificate file
KubernetesMetadata.CaCertFile.ToolTip=Path to a PEM CA certificate bundle. Empty = from kubeconfig
KubernetesMetadata.ClientCertFile.Label=Client certificate file
KubernetesMetadata.ClientCertFile.ToolTip=Client certificate for mutual TLS, used with the client key. Empty = from kubeconfig
KubernetesMetadata.ClientKeyFile.Label=Client key file
KubernetesMetadata.ClientKeyFile.ToolTip=Client private key for mutual TLS, used with the client certificate
KubernetesMetadata.SkipTls.Label=Skip TLS verification
KubernetesMetadata.SkipTls.ToolTip=Skip verification of the API server certificate (development only)
KubernetesMetadata.ConnectTimeout.Label=Connect timeout (seconds)
KubernetesMetadata.ConnectTimeout.ToolTip=Connection timeout on the HTTP client. Default 10
KubernetesMetadata.RequestTimeout.Label=Request timeout (seconds)
KubernetesMetadata.RequestTimeout.ToolTip=Request timeout on the HTTP client. Default 120